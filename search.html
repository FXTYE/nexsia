<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
<link rel="shortcut icon" href="favicon.ico">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex,follow">
<title>Search | Nexsia</title>
<meta name="description" content="Search Nexsia's reviews, comparisons and guides.">
<style>
  :root{
    --ink:#0f1b2d;--body:#3d4b5c;--muted:#6b7887;--line:#e3e8ef;
    --bg:#f6f8fb;--card:#fff;--brand:#1a56db;--brand-dark:#12409c;
    --brand-tint:#eef3fe;--good:#188a5b;--good-tint:#e7f5ee;
    --bad:#c23b52;--bad-tint:#fbeaed;--star:#f5a623;--cta:#ff6a2b;--cta-dark:#e5551a;
    --radius:12px;--shadow:0 1px 3px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.05);--maxw:960px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;color-scheme:light;background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--body);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{color:var(--ink);line-height:1.25;margin:0 0 .5em}
  h1{font-size:1.9rem;letter-spacing:-.02em}
  a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

  .s-hero{padding:36px 0 8px}
  .s-hero p{color:var(--muted);margin:8px 0 0;font-size:1rem}
  .s-form{margin-top:22px}
  .s-input-wrap{position:relative}
  .s-input{width:100%;padding:14px 46px 14px 18px;font:inherit;font-size:1.05rem;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);box-sizing:border-box}
  .s-input:focus{outline:2px solid var(--brand);outline-offset:1px}
  .s-input-wrap svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

  .s-meta{margin-top:18px;font-size:.9rem;color:var(--muted)}

  .s-list{display:flex;flex-direction:column;gap:12px;margin:22px 0 60px}
  .s-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .s-item a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px;color:inherit}
  .s-item a:hover{text-decoration:none;background:var(--brand-tint)}
  .s-item h3{margin:0;font-size:1.02rem;font-weight:600}
  .s-item a:hover h3{color:var(--brand)}
  .s-badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 11px;border-radius:20px;flex-shrink:0;white-space:nowrap}
  .s-badge.review{color:var(--brand);background:var(--brand-tint)}
  .s-badge.best{color:var(--good);background:var(--good-tint)}
  .s-badge.vs{color:#8a5a12;background:#fff3dc}
  .s-badge.other{color:var(--muted);background:#eef1f5}

  .s-empty,.s-prompt{color:var(--muted);font-size:.98rem;margin:0}
  .s-suggest{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .s-suggest a{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:.88rem;color:var(--ink);box-shadow:var(--shadow)}
  .s-suggest a:hover{color:var(--brand);text-decoration:none;border-color:var(--brand)}
</style>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div id="site-header"></div>

<div class="wrap">
  <section class="s-hero">
    <h1>Search Nexsia</h1>
    <p id="s-sub">Search every review, comparison and guide on the site.</p>

    <form class="s-form" id="s-form" role="search">
      <div class="s-input-wrap">
        <input type="text" id="s-input" class="s-input" placeholder="Try “kling”, “web hosting”, or “ClickFunnels vs Kajabi”…" autocomplete="off" aria-label="Search Nexsia">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
    </form>

    <div class="s-meta" id="s-meta"></div>
    <div class="s-list" id="s-list"></div>
  </section>
</div>

<div id="site-footer"></div>

<script>
(function () {
  function getQueryParam() {
    var params = new URLSearchParams(window.location.search);
    return params.get("q") || "";
  }

  var BADGE_LABEL = { review: "Review", best: "Best of", vs: "Comparison", other: "Page" };

  function renderList(query) {
    var meta = document.getElementById("s-meta");
    var list = document.getElementById("s-list");
    var q = query.trim();
    list.innerHTML = "";

    if (!q) {
      meta.textContent = "";
      var count = (typeof SITE_PAGES !== "undefined") ? SITE_PAGES.length : "all";
      var prompt = document.createElement("p");
      prompt.className = "s-prompt";
      prompt.textContent = "Type something above to search " + count + " reviews, comparisons and guides. Or jump straight to a category:";
      list.appendChild(prompt);

      var suggest = document.createElement("div");
      suggest.className = "s-suggest";
      [
        ["Creator Tools", "best-ai-tools-for-youtubers.html"],
        ["Sales Funnels", "best-sales-funnel-software.html"],
        ["Copywriting Tools", "best-ai-copywriting-tools.html"],
        ["Email Marketing", "best-email-marketing-software.html"],
        ["Web Hosting", "best-web-hosting.html"],
        ["AI Video Generators", "best-ai-video-generators.html"]
      ].forEach(function (c) {
        var a = document.createElement("a");
        a.href = c[1];
        a.textContent = c[0];
        suggest.appendChild(a);
      });
      list.appendChild(suggest);
      return;
    }

    if (typeof filterSitePages !== "function") return;
    var matches = filterSitePages(q);

    meta.textContent = matches.length + (matches.length === 1 ? " result" : " results") + " for “" + q + "”";

    if (!matches.length) {
      var empty = document.createElement("p");
      empty.className = "s-empty";
      empty.textContent = "No pages matched that search. Try a shorter or more general term.";
      list.appendChild(empty);
      return;
    }

    matches.forEach(function (p) {
      var kind = siteSearchKind(p.u);
      var item = document.createElement("div");
      item.className = "s-item";
      var a = document.createElement("a");
      a.href = p.u;
      var h3 = document.createElement("h3");
      h3.textContent = p.t;
      var badge = document.createElement("span");
      badge.className = "s-badge " + kind;
      badge.textContent = BADGE_LABEL[kind];
      a.appendChild(h3);
      a.appendChild(badge);
      item.appendChild(a);
      list.appendChild(item);
    });
  }

  function start() {
    var input = document.getElementById("s-input");
    var form = document.getElementById("s-form");
    var initialQuery = getQueryParam();

    input.value = initialQuery;
    if (initialQuery) document.title = "Search: " + initialQuery + " | Nexsia";
    renderList(initialQuery);

    function syncAndRender() {
      var q = input.value;
      var url = "search.html" + (q.trim() ? "?q=" + encodeURIComponent(q.trim()) : "");
      window.history.replaceState(null, "", url);
      renderList(q);
    }

    input.addEventListener("input", syncAndRender);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      syncAndRender();
    });
  }

  if (document.querySelector(".topbar")) {
    start();
  } else {
    document.addEventListener("nexsia:chrome-ready", start, { once: true });
  }
})();
</script>
<script src="nexsia.js"></script>
</body>
</html>
